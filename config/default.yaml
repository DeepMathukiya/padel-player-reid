# video_path: Data/game-24412_77-107min.mp4

video_path: Data/court2.mp4
# video_path: Data/court3.mp4        # with court_config: config/court_court3.yaml

court_config: config/court.yaml
cache_dir: cache
output_dir: outputs
device: cuda                        # YOLO + Re-ID on the NVIDIA GPU; cpu = run without one (several times slower)

# Optional frame range (inclusive start, exclusive end); null = whole video.
start_frame: null
end_frame: null

detection:
  model: yolo11m.pt                 # larger than s for small far players, still fast (yolo11l/x: slower)
  tracker_config: config/botsort_padel.yaml
  image_size: 960                   # long side of the court-ROI crop fed to YOLO (game-24412 with yolo11s: both far players in 97% of frames)
  mask_outside_court: true          # grey out everything outside the court ROI before YOLO (court/court_roi_mask.py)
  gpu_preprocessing: true           # crop/mask/resize on the GPU (detection/gpu_batched_yolo.py); ignored with device: cpu
  batch_size: 8                     # frames per YOLO forward pass; tracking stays frame by frame
  half_precision: true              # GPU only; the CPU always runs float32
  min_confidence: 0.2
  min_box_height_px: 25             # far players at the back glass of a small court are ~30 px tall
  max_players: 4
  max_players_per_half: 2           # an extra near box can't push a far player out of the top 4

tracking:
  interaction_iou: 0.05          # boxes overlapping more than this = interaction
  interaction_foot_distance_m: 1.0
  interaction_pad_frames: 3      # extend each interaction a little on both sides
  min_tracklet_frames: 3

reid:
  weights: weights/osnet_ain_x1_0_msmt17.pth
  input_size: [256, 128]          # height, width
  embed_stride: 3                 # embed every Nth frame of a tracklet
  batch_size: 64
  color_weight: 0.2
  bank_size: 100

identity:
  seeding:                        # label-free gallery seeds (identity/anchor_seeding.py)
    sample_seconds: 1.0           # look for anchor sets once per second
    min_tracklet_seconds: 1.5     # anchor members must be long, clean tracklets
    min_evidence_seconds: 0.5
    min_anchor_sets: 3            # fewer 4-player sets than this: fall back to 3-, then 2-player sets
    min_margin: 0.05              # best vs. second-best mapping (summed similarity) to accept a set
    side_continuity_seconds: 60   # a set should keep the teams on the halves of its neighbours ...
    side_switch_penalty: 0.3      # ... unless appearance beats this (changeovers)
    refine_iterations: 5
  window_seconds: 5               # side/team state is decided per window
  side_flip_cost: 100.0           # cost of a team changing ends between windows
  side_violation_cost: 10.0       # per second a player spends on the wrong half
  appearance_cost_scale: 10.0     # per nat of log-probability, per second of good evidence
  max_evidence_seconds: 10.0      # appearance evidence weight is capped at this
  unknown_cost: 4.0               # nats: unlabelled only if every allowed player is this much worse
  relink_bonus: 3.0               # reward for same player across a gated short gap
  assignment_rounds: 2            # round 2 re-scores with a gallery grown from round 1
  max_speed_mps: 7.0
  relink_max_gap_seconds: 2.0
  border_margin_fraction: 0.02    # tracklet ends this close to the frame edge = exit
  interpolate_max_gap_frames: 30
  smoothing_window: 9
  solver_time_limit_s: 120

rendering:
  draw_minimap: true

# `python -m padel_reid live`: frames are processed as they arrive and shown lag_seconds late.
live:
  lag_seconds: 2.0                # display delay: room to fix crossings, fill gaps and smooth before showing
  window_seconds: 60              # each solve looks at the tracklets of the last minute
  solve_interval_seconds: 1.0     # solve again after this much new video
  solver_time_limit_s: 0.5
  reseed_seconds: 30              # re-run anchor-set seeding (and grow the gallery) this often ...
  reseed_history_seconds: null    # ... over this much recent history (null = the whole session)
  gallery_from_shown: false       # also learn from confidently shown tracklets (self-training)
  region_numbering: true          # number players by court region (near-left/right = 1/2, far-left/right = 3/4)
                                  # as they appear; false = wait for all 4 in clear view
  region_min_seconds: 0.5         # a tracklet must last this long before its region gives it a number
  gate_recalibrate_seconds: 120   # recalibrate the re-link gate from clean tracklets seen so far
  realtime_playback: true         # file sources: pace at the video fps (false = as fast as possible)
  playback_speed: 1.0             # file sources: 2.0 = twice the video fps (no frames dropped when != 1)
  display: true                   # OpenCV window (q or Esc to stop)
  max_seconds: null               # stop after this much video (cameras never end); null = until q / Ctrl-C / end
  display_width: 1280
  write_video: true               # outputs/padel_player_ids_live.mp4
  camera_queue_frames: 30         # cameras: 1 s of slack, then drop the oldest frame when behind
  embed_batch: 16                 # OSNet runs once this many crops wait ...
  embed_max_wait_frames: 15       # ... or the oldest has waited this long (each call has ~20 ms overhead)

# Hand labels are used only here, never by inference.
evaluation:
  seed_labels_file: evaluation_data/seed_tracklet_labels.yaml          # oracle baseline + extra GT
  seed_ground_truth: evaluation_data/seed_ground_truth.csv
  heldout_ground_truth: evaluation_data/heldout_ground_truth.csv
  annotation_labels_file: evaluation_data/new_tracklet_labels.yaml     # written by the `label` stage
  annotation_min_tracklet_frames: 45                                   # only offer long, clean tracklets
  thumbnails_per_tracklet: 6
